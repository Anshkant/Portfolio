  <circle cx="35" cy="30" r="6" fill="#F2B441"/>
  <text x="52" y="36" fill="#EDEFF4" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="1.5">AI KPI MONITOR // OPERATIONAL TELEMETRY</text>
  
  <rect x="940" y="16" width="105" height="28" rx="14" fill="rgba(39,201,63,0.12)" stroke="rgba(39,201,63,0.3)" stroke-width="1"/>
  <circle cx="956" cy="30" r="4" fill="#27C93F"/>
  <text x="968" y="35" fill="#27C93F" font-family="monospace" font-size="12" font-weight="600">3-SIGMA LIVE</text>

  <rect x="1060" y="16" width="105" height="28" rx="14" fill="#1A202E" stroke="#2D3448" stroke-width="1"/>
  <text x="1080" y="35" fill="#8A90A0" font-family="monospace" font-size="12">STREAM ON</text>

  <!-- Metric Cards Row -->
