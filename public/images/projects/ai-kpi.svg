  <text x="65" y="120" fill="#8A90A0" font-family="monospace" font-size="12" letter-spacing="1">SYSTEM THROUGHPUT</text>
  <text x="65" y="165" fill="#EDEFF4" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700">98.42%</text>
  <text x="210" y="165" fill="#27C93F" font-family="monospace" font-size="13" font-weight="bold">+2.4%</text>

  <!-- Card 2 -->
