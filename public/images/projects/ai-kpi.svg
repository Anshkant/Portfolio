  <text x="70" y="292" fill="#8A90A0" font-family="monospace" font-size="11">MONITORING 142 HIGH-THROUGHPUT METRIC CHANNELS · RESOLUTION 1 SEC</text>

  <!-- Chart Grid Lines -->
  <line x1="70" y1="340" x2="840" y2="340" stroke="#1D2433" stroke-dasharray="4,4"/>
  <line x1="70" y1="410" x2="840" y2="410" stroke="#1D2433" stroke-dasharray="4,4"/>
  <line x1="70" y1="480" x2="840" y2="480" stroke="#1D2433" stroke-dasharray="4,4"/>
  <line x1="70" y1="550" x2="840" y2="550" stroke="#1D2433" stroke-dasharray="4,4"/>

