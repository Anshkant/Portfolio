  <circle cx="520" cy="350" r="14" fill="none" stroke="#F2B441" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="470" y="295" width="105" height="32" rx="6" fill="#1C2333" stroke="#F2B441" stroke-width="1"/>
  <text x="480" y="316" fill="#F2B441" font-family="monospace" font-size="11" font-weight="bold">+3.2σ SPIKE</text>

