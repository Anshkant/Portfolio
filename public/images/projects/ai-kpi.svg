  <!-- Fill Area -->
  <path d="M 70 520 Q 150 490 220 440 T 380 430 T 520 350 T 640 460 T 740 380 T 840 420 L 840 560 L 70 560 Z" fill="url(#chartGrad)"/>
  <!-- Stroke Line -->
  <path d="M 70 520 Q 150 490 220 440 T 380 430 T 520 350 T 640 460 T 740 380 T 840 420" fill="none" stroke="#F2B441" stroke-width="3.5"/>

