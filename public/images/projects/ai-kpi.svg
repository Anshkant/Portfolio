  <circle cx="945" cy="317" r="4" fill="#27C93F"/>
  <text x="960" y="321" fill="#EDEFF4" font-family="monospace" font-size="11" font-weight="600">ETL_WORKER #04</text>
  <text x="940" y="345" fill="#8A90A0" font-family="system-ui" font-size="11">Data pipeline normalized in 4.2s</text>
  <text x="940" y="365" fill="#5C7CFA" font-family="monospace" font-size="10">STATUS: RECOVERED</text>

  <!-- Feed Item 2 -->
  <rect x="925" y="395" width="215" height="85" rx="8" fill="#181E2C" stroke="#242C3E" stroke-width="1"/>
  <circle cx="945" cy="417" r="4" fill="#F2B441"/>
  <text x="960" y="421" fill="#EDEFF4" font-family="monospace" font-size="11" font-weight="600">QUERY_LATENCY</text>
  <text x="940" y="445" fill="#8A90A0" font-family="system-ui" font-size="11">Auto-adjusted Mongo batch index</text>
  <text x="940" y="465" fill="#F2B441" font-family="monospace" font-size="10">STATUS: BALANCED</text>

  <!-- Feed Item 3 -->
  <rect x="925" y="495" width="215" height="85" rx="8" fill="#181E2C" stroke="#242C3E" stroke-width="1"/>
  <circle cx="945" cy="517" r="4" fill="#5C7CFA"/>
  <text x="960" y="521" fill="#EDEFF4" font-family="monospace" font-size="11" font-weight="600">TELEGRAM_ALERT</text>
  <text x="940" y="545" fill="#8A90A0" font-family="system-ui" font-size="11">Incident notification dispatched</text>
  <text x="940" y="565" fill="#27C93F" font-family="monospace" font-size="10">DELIVERY &lt; 2.1s</text>
</svg>
