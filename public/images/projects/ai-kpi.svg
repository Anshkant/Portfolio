  <text x="355" y="120" fill="#8A90A0" font-family="monospace" font-size="12" letter-spacing="1">VARIANCE THRESHOLD</text>
  <text x="355" y="165" fill="#F2B441" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700">1.28 σ</text>
  <text x="495" y="165" fill="#F2B441" font-family="monospace" font-size="13">STABLE</text>

  <!-- Card 3 -->
  <rect x="620" y="85" width="260" height="120" rx="12" fill="#151A26" stroke="#262D3D" stroke-width="1"/>
