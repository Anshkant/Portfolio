  <rect x="765" y="230" width="395" height="395" rx="14" fill="#131824" stroke="#242B3C" stroke-width="1"/>
  <text x="795" y="270" fill="#EDEFF4" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Cohort Risk Classification</text>
  <text x="795" y="292" fill="#8A90A0" font-family="monospace" font-size="11">CUSTOMER RETENTION SEGMENTS</text>

  <!-- Segments Info -->
  <circle cx="850" cy="350" r="8" fill="#27C93F"/>
  <text x="870" y="355" fill="#EDEFF4" font-family="monospace" font-size="13" font-weight="bold">Safe Cohort (Tenure &gt; 2 Yrs)</text>
  <text x="870" y="375" fill="#8A90A0" font-family="system-ui" font-size="11">Low churn probability &lt; 5% · 68.2% total pool</text>

  <circle cx="850" cy="420" r="8" fill="#F2B441"/>
  <text x="870" y="425" fill="#EDEFF4" font-family="monospace" font-size="13" font-weight="bold">Moderate Risk (High Monthly Fee)</text>
  <text x="870" y="445" fill="#8A90A0" font-family="system-ui" font-size="11">Probability 25-45% · Targeted discount eligibility</text>

  <circle cx="850" cy="490" r="8" fill="#FF5F56"/>
  <text x="870" y="495" fill="#EDEFF4" font-family="monospace" font-size="13" font-weight="bold">Critical Churn Risk (Month-to-Month)</text>
  <text x="870" y="515" fill="#8A90A0" font-family="system-ui" font-size="11">Immediate retention outreach trigger &gt; 70% risk</text>

