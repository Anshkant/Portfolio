  <text x="52" y="36" fill="#EDEFF4" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="1.5">CUSTOMER CHURN &amp; RETENTION INTELLIGENCE</text>
  
  <rect x="910" y="16" width="130" height="28" rx="14" fill="rgba(242,180,65,0.12)" stroke="rgba(242,180,65,0.3)" stroke-width="1"/>
