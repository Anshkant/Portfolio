<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="50%" stop-color="#141924"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradP)"/>
  <rect width="1200" height="675" fill="none" stroke="#232838" stroke-width="2"/>

  <!-- Top Nav Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#121622" stroke="#232838" stroke-width="1"/>
  <circle cx="35" cy="30" r="6" fill="#38BDF8"/>
  <text x="52" y="36" fill="#EDEFF4" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="1.5">PATIENT READMISSION &amp; CLINICAL INTELLIGENCE</text>
  
  <rect x="910" y="16" width="130" height="28" rx="14" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <circle cx="928" cy="30" r="4" fill="#38BDF8"/>
  <text x="940" y="35" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="600">ROC-AUC 0.814</text>

  <rect x="1055" y="16" width="110" height="28" rx="14" fill="#1A202E" stroke="#2D3448" stroke-width="1"/>
  <text x="1070" y="35" fill="#27C93F" font-family="monospace" font-size="12">EDA VALIDATED</text>

  <!-- Metric Cards Row -->
  <!-- Card 1 -->
  <rect x="40" y="85" width="260" height="120" rx="12" fill="#151A26" stroke="#262D3D" stroke-width="1"/>
  <text x="65" y="120" fill="#8A90A0" font-family="monospace" font-size="12" letter-spacing="1">PREDICTIVE ROC-AUC</text>
  <text x="65" y="165" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700">0.814</text>
  <text x="180" y="165" fill="#27C93F" font-family="monospace" font-size="13" font-weight="bold">+14.2%</text>

  <!-- Card 2 -->
  <rect x="330" y="85" width="260" height="120" rx="12" fill="#151A26" stroke="#262D3D" stroke-width="1"/>
  <text x="355" y="120" fill="#8A90A0" font-family="monospace" font-size="12" letter-spacing="1">HIGH-RISK COHORT</text>
  <text x="355" y="165" fill="#FF5F56" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700">18.2%</text>
  <text x="475" y="165" fill="#FF5F56" font-family="monospace" font-size="12">FLAGS</text>

  <!-- Card 3 -->
  <rect x="620" y="85" width="260" height="120" rx="12" fill="#151A26" stroke="#262D3D" stroke-width="1"/>
  <text x="645" y="120" fill="#8A90A0" font-family="monospace" font-size="12" letter-spacing="1">PREVENTABLE RETURNS</text>
  <text x="645" y="165" fill="#F2B441" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700">312 Pts</text>
  <text x="790" y="165" fill="#F2B441" font-family="monospace" font-size="12">SAVED</text>

  <!-- Card 4 -->
  <rect x="910" y="85" width="250" height="120" rx="12" fill="#151A26" stroke="#262D3D" stroke-width="1"/>
  <text x="935" y="120" fill="#8A90A0" font-family="monospace" font-size="12" letter-spacing="1">COST MITIGATION</text>
  <text x="935" y="165" fill="#27C93F" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700">$1.4M</text>
  <text x="1060" y="165" fill="#27C93F" font-family="monospace" font-size="12">ANNUAL</text>

  <!-- Main Chart Section -->
  <rect x="40" y="230" width="700" height="395" rx="14" fill="#131824" stroke="#242B3C" stroke-width="1"/>
  <text x="70" y="270" fill="#EDEFF4" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Clinical Risk Stratification &amp; ROC Curve</text>
  <text x="70" y="292" fill="#8A90A0" font-family="monospace" font-size="11">MODEL COMPARISON: LOGISTIC REGRESSION VS RANDOM FOREST</text>

  <!-- Chart axes -->
  <line x1="80" y1="330" x2="80" y2="570" stroke="#262D3D" stroke-width="2"/>
  <line x1="80" y1="570" x2="660" y2="570" stroke="#262D3D" stroke-width="2"/>

  <!-- Diagonal Baseline -->
  <line x1="80" y1="570" x2="660" y2="330" stroke="#262D3D" stroke-dasharray="4,4"/>

  <!-- ROC Curve Area -->
  <path d="M 80 570 Q 140 370 280 350 T 660 330 L 660 570 Z" fill="url(#areaGrad)"/>
  <path d="M 80 570 Q 140 370 280 350 T 660 330" fill="none" stroke="#38BDF8" stroke-width="3.5"/>

  <!-- Annotations -->
  <circle cx="280" cy="350" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="220" y="380" width="140" height="30" rx="6" fill="#1A2130" stroke="#38BDF8" stroke-width="1"/>
  <text x="230" y="400" fill="#38BDF8" font-family="monospace" font-size="11">OPTIMAL CUTOFF: 0.42</text>

  <!-- Side Feature Weights Column -->
  <rect x="765" y="230" width="395" height="395" rx="14" fill="#131824" stroke="#242B3C" stroke-width="1"/>
  <text x="795" y="270" fill="#EDEFF4" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Primary Clinical Risk Drivers</text>
  <text x="795" y="292" fill="#8A90A0" font-family="monospace" font-size="11">FEATURE IMPORTANCE COEFFICIENTS</text>

  <!-- Risk Bar 1 -->
  <text x="795" y="340" fill="#EDEFF4" font-family="monospace" font-size="12">Prior Inpatient Admissions</text>
  <rect x="795" y="350" width="335" height="14" rx="7" fill="#1D2433"/>
  <rect x="795" y="350" width="280" height="14" rx="7" fill="url(#pGrad)"/>
  <text x="1090" y="340" fill="#38BDF8" font-family="monospace" font-size="12">0.34</text>

  <!-- Risk Bar 2 -->
  <text x="795" y="400" fill="#EDEFF4" font-family="monospace" font-size="12">Number of Prescribed Meds</text>
  <rect x="795" y="410" width="335" height="14" rx="7" fill="#1D2433"/>
  <rect x="795" y="410" width="220" height="14" rx="7" fill="url(#pGrad)"/>
  <text x="1090" y="400" fill="#38BDF8" font-family="monospace" font-size="12">0.26</text>

  <!-- Risk Bar 3 -->
  <text x="795" y="460" fill="#EDEFF4" font-family="monospace" font-size="12">Length of Hospital Stay (LOS)</text>
  <rect x="795" y="470" width="335" height="14" rx="7" fill="#1D2433"/>
  <rect x="795" y="470" width="165" height="14" rx="7" fill="url(#pGrad)"/>
  <text x="1090" y="460" fill="#38BDF8" font-family="monospace" font-size="12">0.19</text>

  <!-- Risk Bar 4 -->
  <text x="795" y="520" fill="#EDEFF4" font-family="monospace" font-size="12">Diabetes Primary Diagnosis</text>
  <rect x="795" y="530" width="335" height="14" rx="7" fill="#1D2433"/>
  <rect x="795" y="530" width="115" height="14" rx="7" fill="url(#pGrad)"/>
  <text x="1090" y="520" fill="#38BDF8" font-family="monospace" font-size="12">0.13</text>

  <rect x="795" y="570" width="335" height="35" rx="6" fill="#1A2130" stroke="#242C3E" stroke-width="1"/>
  <text x="815" y="592" fill="#EDEFF4" font-family="monospace" font-size="11">MODEL GENERALIZATION: <tspan fill="#27C93F">10-FOLD CV PASSED</tspan></text>
</svg>
